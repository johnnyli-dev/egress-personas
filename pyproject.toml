[project]
name = "egress-personas"
version = "0.1.0"
description = "Persona schema and population sampler for the fire-egress research project"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbstripout>=0.7"]

[project.scripts]
personas = "egress_personas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egress_personas"]
artifacts = ["src/egress_personas/explorer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
